name: Sync Candidatos TSE

# Sincroniza os candidatos 2026 do TSE e atualiza os dados do site.
# - Sem R2 configurado: commita os dados (a Vercel publica sozinha).
# - Com R2 configurado (fase 2): SOBE pro Cloudflare e NÃO mexe mais no git.
# Isso elimina conflitos de branch futuros.
#
# Frequência: a cada 3h durante o registro (até ~22/set). Depois, troque
# para 1x/dia (limpe o cache do workflow após editar o cron).

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-candidatos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Falha rápido se o TSE estiver bloqueando (protege contra timeout de 6h)
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar candidatos do TSE
        run: npx tsx scripts/sync-candidatos.ts --upload-r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TSE_QUIET: '1'

      # Detalhes completos (bens, plano, redes, histórico) em lotes —
      # ritmo moderado para não tomar bloqueio do TSE no IP do GitHub.
      - name: Completar perfis (detalhes)
        run: npx tsx scripts/sync-candidatos.ts --detalhes --cap 1500 --upload-r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # Commit apenas quando o R2 ainda NÃO está ativo (senão os dados já vão
      # para o Cloudflare e o git fica limpo — zero conflitos).
      - name: Commit se houver mudanças (quando R2 não configurado)
        if: ${{ secrets.R2_BUCKET == '' }}
        run: |
          git config user.name "quemvotar-bot[bot]"
          git config user.email "125739927+quemvotar-bot[bot]@users.noreply.github.com"
          git add public/dados/candidatos
          if git diff --cached --quiet; then
            echo "Sem mudanças no TSE — nada a commitar."
            exit 0
          fi
          git commit -m "chore(dados): sync candidatos TSE $(date -u +'%Y-%m-%dT%H:%M')Z"
          # Se alguém (humano ou IA) tiver commitado no meio, integra antes de subir
          git pull --rebase origin "$GITHUB_REF_NAME" --autostash || true
          git push origin "$GITHUB_REF_NAME" || { git pull --rebase origin "$GITHUB_REF_NAME" --autostash && git push origin "$GITHUB_REF_NAME"; }
          echo "Dados atualizados e publicados."
