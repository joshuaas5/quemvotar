name: Sync Candidatos TSE

# Sincroniza os candidatos 2026 do TSE a cada hora e, se houver
# mudanças, faz commit — o deploy na Vercel acontece sozinho.
# Custo: R$ 0 (GitHub Actions grátis em repo público; em repo
# privado, ~3 min por execução dentro dos 2.000 min/mês).
#
# Para ativar: basta o repo estar no GitHub e o workflow rodar.
# Opcional (fase 2 — Cloudflare R2): definir secrets R2_* e o
# script sobe os dados para o bucket, zerando a dependência do git.

on:
  schedule:
    # A cada hora, com pequeno deslocamento para não bater no pico do TSE
    - cron: '23 * * * *'
  workflow_dispatch: # permite rodar manualmente pelo GitHub

permissions:
  contents: write

concurrency:
  group: sync-candidatos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # usa o branch padrão do repo (master ou main)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar candidatos do TSE
        run: npx tsx scripts/sync-candidatos.ts --upload-r2
        env:
          # Fase 2 (Cloudflare R2): define estes 4 secrets no GitHub e o
          # upload automático para o bucket passa a acontecer a cada sync.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TSE_QUIET: '1'

      - name: Commit se houver mudanças
        run: |
          git config user.name "quemvotar-bot[bot]"
          git config user.email "125739927+quemvotar-bot[bot]@users.noreply.github.com"
          git add public/dados/candidatos
          if git diff --cached --quiet; then
            echo "Sem mudanças no TSE — nada a commitar."
          else
            git commit -m "chore(dados): sync candidatos TSE $(date -u +'%Y-%m-%dT%H:%M')Z"
            git push
            echo "Dados atualizados e publicados."
          fi
